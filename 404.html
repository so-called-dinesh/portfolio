<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Page Not Found — Dinesh Bodhapalle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <style>
    * { box-sizing: border-box; line-height: 1.2; margin: 0; }

    html {
      background: #0b0b0e;
      color: #9a97a6;
      display: table;
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      height: 100%;
      text-align: center;
      width: 100%;
    }

    body {
      display: table-cell;
      vertical-align: middle;
      margin: 2em auto;
    }

    h1 {
      color: #f4f1e8;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-size: 3em;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    h1 span { color: #efad3f; margin-right: 0.1em; }

    p { margin: 1.2em auto 0; width: 300px; }

    a {
      display: inline-block;
      margin-top: 1.6em;
      padding: 12px 26px;
      border: 1px solid #efad3f;
      border-radius: 999px;
      color: #efad3f;
      text-decoration: none;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.25s ease, color 0.25s ease;
    }

    a:hover { background: #efad3f; color: #191105; }

    @media only screen and (max-width: 280px) {
      body, p { width: 95%; }
      h1 { font-size: 1.5em; margin: 0 0 0.3em; }
    }
  </style>
</head>

<body>
  <h1><span>404</span>Lost in the stack</h1>
  <p>This page isn't routing anywhere. Back to the entry point below.</p>
  <a href="/">Back to home</a>
</body>

</html>
<!-- IE needs 512+ bytes: https://docs.microsoft.com/archive/blogs/ieinternals/friendly-http-error-pages -->
